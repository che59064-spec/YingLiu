<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">工作流库分区示意</title><desc id="desc">左侧工作流库包含导入按钮、搜索、分类和工作流列表。</desc>
<rect width="1200" height="450" rx="28" fill="#f1f3f8"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="35" y="25" width="480" height="400" rx="24" fill="#fff" stroke="#dce2ec" stroke-width="2"/>
<text x="65" y="69" fill="#212b3a" font-size="25" font-weight="700">工作流库</text><text x="470" y="69" text-anchor="end" fill="#8290a2" font-size="20">×</text>
<rect x="65" y="88" width="420" height="48" rx="14" fill="#252e3e"/><text x="275" y="119" text-anchor="middle" fill="#fff" font-size="19">＋ 导入工作流</text>
<rect x="65" y="148" width="420" height="48" rx="14" fill="#f4f6fa" stroke="#e1e7ef"/><text x="84" y="178" fill="#8692a2" font-size="18">⌕  搜索名称或用途</text>
<g font-size="17" text-anchor="middle"><rect x="65" y="209" width="70" height="38" rx="13" fill="#273143"/><text x="100" y="234" fill="#fff">全部</text><rect x="143" y="209" width="70" height="38" rx="13" fill="#f0f3f7"/><text x="178" y="234" fill="#4e5b6e">图片</text><rect x="221" y="209" width="70" height="38" rx="13" fill="#f0f3f7"/><text x="256" y="234" fill="#4e5b6e">视频</text></g>
<rect x="65" y="259" width="420" height="60" rx="15" fill="#f7f8fb"/><text x="85" y="296" fill="#344155" font-size="19">图片工作流示例</text><text x="463" y="296" text-anchor="end" fill="#7b889a" font-size="20">＋</text>
<rect x="65" y="329" width="420" height="60" rx="15" fill="#f7f8fb"/><text x="85" y="366" fill="#344155" font-size="19">动作工作流示例</text><text x="463" y="366" text-anchor="end" fill="#7b889a" font-size="20">＋</text>
<text x="565" y="86" fill="#1f2938" font-size="27" font-weight="700">① 工作流库</text>
<text x="565" y="137" fill="#4d5d72" font-size="20">入口：点击最左侧“工作流”。</text>
<text x="565" y="185" fill="#4d5d72" font-size="20">导入：选择 ComfyUI 工作流 JSON。</text>
<text x="565" y="233" fill="#4d5d72" font-size="20">搜索与分类：按名称或用途查找。</text>
<text x="565" y="281" fill="#4d5d72" font-size="20">添加：点击列表，把工作流放到画布。</text>
<text x="565" y="342" fill="#7c8899" font-size="17">示意图 · 工作流由用户自行导入</text>
</g></svg>
