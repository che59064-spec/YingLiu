<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">动作迁移卡片分区示意</title><desc id="desc">在支持的动作工作流卡片连接图片与视频，设置分段时间和接续上一段。</desc>
<rect width="1200" height="450" rx="28" fill="#f1f3f8"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<path d="M32 197 C58 197 58 230 84 230 M32 260 C58 260 58 230 84 230" fill="none" stroke="#96a4b7" stroke-width="3"/>
<rect x="84" y="25" width="455" height="400" rx="24" fill="#fff" stroke="#cfd8e5" stroke-width="2"/>
<text x="114" y="68" fill="#243043" font-size="23" font-weight="700">动作迁移工作流</text><text x="502" y="68" text-anchor="end" fill="#8290a2" font-size="21">···</text>
<text x="114" y="104" fill="#8490a0" font-size="17">本机 ComfyUI 工作流</text>
<text x="114" y="145" fill="#425169" font-size="18">画面描述</text><rect x="114" y="156" width="395" height="55" rx="13" fill="#f2f4f8"/><text x="132" y="190" fill="#8591a1" font-size="17">输入希望生成的画面</text>
<rect x="114" y="227" width="190" height="46" rx="12" fill="#f2f4f8"/><rect x="319" y="227" width="190" height="46" rx="12" fill="#f2f4f8"/><text x="209" y="257" text-anchor="middle" fill="#4e5b6e" font-size="17">开始秒数</text><text x="414" y="257" text-anchor="middle" fill="#4e5b6e" font-size="17">结束秒数</text>
<text x="114" y="306" fill="#425169" font-size="18">接续上一段</text><rect x="114" y="319" width="395" height="43" rx="12" fill="#f2f4f8"/><text x="132" y="346" fill="#758397" font-size="17">选择当前画布的上一段视频</text>
<rect x="337" y="374" width="172" height="35" rx="13" fill="#252e3e"/><text x="423" y="398" text-anchor="middle" fill="#fff" font-size="17">▶ 开始生成</text>
<circle cx="84" cy="230" r="8" fill="#fff" stroke="#96a4b7" stroke-width="3"/>
<text x="585" y="80" fill="#1f2938" font-size="27" font-weight="700">② 动作迁移卡片</text>
<text x="585" y="135" fill="#4d5d72" font-size="20">输入：连接人物参考图和动作视频。</text>
<text x="585" y="185" fill="#4d5d72" font-size="20">分段：选择动作视频的起止秒数。</text>
<text x="585" y="235" fill="#4d5d72" font-size="20">接续：选择上一段，用末帧引导开头。</text>
<text x="585" y="285" fill="#4d5d72" font-size="20">运行：点击“开始生成”，等待作品。</text>
<text x="585" y="353" fill="#7c8899" font-size="17">示意图 · 参数随工作流而变化</text>
<text x="585" y="383" fill="#7c8899" font-size="17">接续仅适用于支持的 H3 工作流</text>
</g></svg>
